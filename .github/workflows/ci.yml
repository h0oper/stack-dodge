name: CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ m3-dev ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci || npm i
      - run: npm run type-check
      - run: npm test
